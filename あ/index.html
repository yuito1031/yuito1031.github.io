<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neo study park group</title>
  <style>
    /* 配色定義：生成り色・アースカラー */
    :root {
      --bg-color: #f7f4ef;        /* 温かみのある生成り色 */
      --card-bg: #fffefb;         /* 柔らかなアイボリーホワイト */
      --text-color: #383531;      /* 落ち着いたダークブラウン */
      --text-sub: #78736a;       /* サブテキストカラー */
      --accent-color: #8c6d53;    /* アースブラウン */
      --accent-hover: #6e543e;    /* アースブラウン（濃いめ） */
      --accent-light: #e8dfd5;    /* ハイライト */
      --shadow-sm: 0 4px 15px rgba(140, 109, 83, 0.06);
      --shadow-hover: 0 12px 28px rgba(140, 109, 83, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.7;
      overflow-x: hidden;
    }

    /* Keyframe アニメーション */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ナビゲーションバー */
    nav {
      background: rgba(255, 254, 251, 0.9);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--accent-light);
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--accent-color);
      letter-spacing: 0.03em;
    }

    .nav-buttons {
      display: flex;
      gap: 0.8rem;
    }

    .btn {
      padding: 0.4rem 1.1rem;
      border-radius: 20px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 1px solid var(--accent-color);
      font-weight: 600;
    }

    .btn-outline {
      background: transparent;
      color: var(--accent-color);
    }

    .btn-outline:hover {
      background: var(--accent-light);
    }

    .btn-filled {
      background: var(--accent-color);
      color: #fff;
    }

    .btn-filled:hover {
      background: var(--accent-hover);
    }

    /* ヘッダー */
    header {
      background: linear-gradient(135deg, #f2eae1 0%, #e8dfd5 100%);
      padding: 3.5rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--accent-light);
      animation: fadeInUp 0.8s ease-out forwards;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--text-color);
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* メインコンテンツ */
    .container {
      max-width: 800px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    .card-grid {
      display: grid;
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.8rem;
      border: 1px solid rgba(220, 210, 200, 0.5);
      box-shadow: var(--shadow-sm);
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      opacity: 0;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .card:nth-child(1) { animation-delay: 0.2s; }
    .card:nth-child(2) { animation-delay: 0.4s; }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent-color);
    }

    .card h2 {
      font-size: 1.3rem;
      color: var(--accent-color);
      margin-bottom: 0.8rem;
    }

    /* モーダル（ポップアップ）共通スタイル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(56, 53, 49, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    .modal-box {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 2.2rem;
      width: 90%;
      max-width: 420px;
      box-shadow: var(--shadow-hover);
      position: relative;
      animation: fadeInUp 0.3s ease;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1.2rem;
      font-size: 1.4rem;
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
    }

    .modal-title {
      font-size: 1.4rem;
      color: var(--accent-color);
      margin-bottom: 1.2rem;
      text-align: center;
    }

    /* フォーム要素 */
    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 0.3rem;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--accent-light);
      border-radius: 8px;
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.25s ease;
    }

    .form-group input:focus {
      border-color: var(--accent-color);
    }

    .form-submit {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      background: var(--accent-color);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.25s ease;
      margin-top: 0.5rem;
    }

    .form-submit:hover {
      background: var(--accent-hover);
    }

    footer {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-sub);
      font-size: 0.85rem;
      border-top: 1px solid var(--accent-light);
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <!-- ナビゲーション -->
  <nav>
    <div class="nav-logo">Neo study park group</div>
    <div class="nav-buttons">
      <button class="btn btn-outline" onclick="openModal('loginModal')">ログイン</button>
      <button class="btn btn-filled" onclick="openModal('registerModal')">新規入会</button>
    </div>
  </nav>

  <!-- ヘッダー -->
  <header>
    <h1>Neo study park group</h1>
    <p>共に学び、共に成長するナレッジコミュニティ</p>
  </header>

  <!-- メインコンテンツ -->
  <div class="container">
    <div class="card-grid">
      <div class="card">
        <h2>📢 お知らせ</h2>
        <p>Neo study park groupへようこそ！新規会員を募集しています。右上の「新規入会」ボタンから登録を行ってください。</p>
      </div>

      <div class="card">
        <h2>📚 学習スペース</h2>
        <p>ログインすると、メンバー限定の学習ノートや進捗管理機能にアクセスできます。</p>
      </div>
    </div>
  </div>

  <!-- ログイン モーダル -->
  <div id="loginModal" class="modal-overlay" onclick="closeModalOnBg(event, 'loginModal')">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('loginModal')">&times;</button>
      <h2 class="modal-title">ログイン</h2>
      <form onsubmit="handleAuth(event, 'ログインしました')">
        <div class="form-group">
          <label>メールアドレス</label>
          <input type="email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label>パスワード</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="form-submit">ログインする</button>
      </form>
    </div>
  </div>

  <!-- 新規入会 モーダル -->
  <div id="registerModal" class="modal-overlay" onclick="closeModalOnBg(event, 'registerModal')">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal('registerModal')">&times;</button>
      <h2 class="modal-title">新規入会</h2>
      <form onsubmit="handleAuth(event, 'Neo study park groupへの入会申請を受け付けました！')">
        <div class="form-group">
          <label>お名前</label>
          <input type="text" placeholder="山田 太郎" required>
        </div>
        <div class="form-group">
          <label>メールアドレス</label>
          <input type="email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label>パスワード設定</label>
          <input type="password" placeholder="8文字以上" required minlength="8">
        </div>
        <button type="submit" class="form-submit">入会を申し込む</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Neo study park group. All rights reserved.</p>
  </footer>

  <!-- JavaScript（モーダル制御・送信体験） -->
  <script>
    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function closeModalOnBg(event, id) {
      if (event.target.id === id) {
        closeModal(id);
      }
    }

    function handleAuth(event, message) {
      event.preventDefault();
      alert(message);
      closeModal('loginModal');
      closeModal('registerModal');
    }
  </script>

</body>
</html>
