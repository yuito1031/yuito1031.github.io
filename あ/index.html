<!DOCTYPE html>
<html lang="ja">
<head>
<title>あ</title>
<link rel="stylesheet" href="https://e24028.github.io/common.css">
</head>
<body onload="onLoad()">
<div id="main">
    <h1>あ</h1>
    <button onclick="toggleDark()" id="btn">ダークモードに切り替え</button>
</div>
<script src="https://e24028.github.io/javascript.js"></script>
<script>
function onLoad()
{
    if (getParams2('dark') === 'true')
    {
        toggleDark();
    }
}

function toggleDark()
{
    let btn = s('btn');
    let root = q('html');

    if (getParams2('dark') === 'true')
    {
        btn.innerText = 'ライトモードに切り替え';
        root.toggleAttribute('dark', true);
        setParams2('dark', 'true');
    } else {
        btn.innerText = 'ダークモードに切り替え';
        root.toggleAttribute('dark', false);
        setParams2('dark', 'false');
    }
}
</script>
</body>
</html>
