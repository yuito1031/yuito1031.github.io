<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Atelier Note - 多機能デジタルノート</title>
  <style>
    /* ==========================================================================
       基本リセット＆デザイン変数（温かみのあるアイボリー＆スレート基調）
       ========================================================================== */
    :root {
      --bg-app: #f3f1ed;
      --bg-panel: #ffffff;
      --bg-sidebar: #faf9f6;
      --bg-muted: #f1efea;
      --bg-hover: #eae6df;
      --border-color: #e2ddd5;
      --border-strong: #cfc8bc;
      --text-main: #292524;
      --text-sub: #57534e;
      --text-muted: #8c857e;
      --accent: #b45309;
      --accent-hover: #92400e;
      --accent-soft: #fef3c7;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --success: #059669;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(28, 25, 23, 0.06);
      --shadow-md: 0 4px 14px rgba(28, 25, 23, 0.1);
      --shadow-lg: 0 12px 30px rgba(28, 25, 23, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(140, 133, 126, 0.4);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(140, 133, 126, 0.7);
    }

    /* ==========================================================================
       トップヘッダー
       ========================================================================== */
    .app-header {
      height: 54px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
      z-index: 30;
      box-shadow: var(--shadow-sm);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-md);
      color: var(--text-sub);
      flex-shrink: 0;
    }
    .icon-btn:hover:not(:disabled) {
      background: var(--bg-muted);
      color: var(--text-main);
    }

    .breadcrumb-editor {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
      max-width: 560px;
    }

    .notebook-badge-dot {
      width: 12px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(0, 0, 0, 0.15);
    }

    .header-title-input {
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 4px 8px;
      font-size: 14px;
      min-width: 60px;
      outline: none;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
    }
    .header-title-input:hover {
      border-color: var(--border-color);
      background: var(--bg-sidebar);
    }
    .header-title-input:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }
    #header-notebook-input {
      font-weight: 700;
      max-width: 210px;
    }
    #header-page-input {
      font-weight: 500;
      color: var(--text-sub);
      max-width: 190px;
    }

    .breadcrumb-sep {
      color: var(--text-muted);
      font-size: 15px;
      flex-shrink: 0;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .save-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .save-badge.saved svg {
      color: var(--success);
    }
    .save-badge.saving svg {
      color: var(--accent);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      padding: 7px 13px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }

    /* ==========================================================================
       メインワークスペース（サイドバー + エディタエリア）
       ========================================================================== */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* サイドバー（2階層：ノート一覧 + ページ一覧） */
    .sidebar {
      width: 280px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 25;
      transition: margin-left 0.25s ease, transform 0.25s ease;
    }
    .sidebar.collapsed {
      margin-left: -280px;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .sidebar-notebooks {
      flex: 0 0 46%;
      border-bottom: 1px solid var(--border-color);
    }
    .sidebar-pages {
      flex: 1;
    }

    .section-header {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(226, 221, 213, 0.6);
      background: rgba(255, 255, 255, 0.5);
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-small-add {
      padding: 4px 9px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      background: var(--accent-soft);
      color: var(--accent-hover);
      border: 1px solid rgba(180, 83, 9, 0.2);
    }
    .btn-small-add:hover {
      background: #fde68a;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* ノート＆ページ共通カードアイテム */
    .item-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      background: #ffffff;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .item-card:hover {
      border-color: var(--border-strong);
      background: #fdfcfa;
    }
    .item-card.active {
      border-color: var(--accent);
      background: #fffbeb;
      box-shadow: 0 0 0 1px rgba(180, 83, 9, 0.25);
    }

    .item-card-main {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }

    .notebook-cover-icon {
      width: 14px;
      height: 20px;
      border-radius: 3px;
      flex-shrink: 0;
      box-shadow: inset -2px 0 0 rgba(0, 0, 0, 0.18), 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .page-num-badge {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--bg-muted);
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .item-card.active .page-num-badge {
      background: var(--accent);
      color: #ffffff;
    }

    .item-info {
      min-width: 0;
      flex: 1;
    }
    .item-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-card.active .item-title {
      color: var(--accent-hover);
    }
    .item-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0.75;
    }
    .item-card:hover .item-actions {
      opacity: 1;
    }

    .mini-action-btn {
      width: 26px;
      height: 26px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
    }
    .mini-action-btn:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }
    .mini-action-btn.delete:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 20;
    }

    /* ==========================================================================
       メインキャンバス＆ツールバー領域
       ========================================================================== */
    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
      overflow: hidden;
    }

    /* ツールバー */
    .toolbar {
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--border-color);
      padding: 7px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 15;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-muted);
      padding: 3px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      max-width: 100%;
    }

    .tool-btn {
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-sub);
      white-space: nowrap;
    }
    .tool-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.6);
    }
    .tool-btn.active {
      background: #ffffff;
      color: var(--primary);
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }

    .tool-divider {
      width: 1px;
      height: 18px;
      background: var(--border-strong);
      margin: 0 2px;
      flex-shrink: 0;
    }

    /* カラーパレット＆太さ調整 */
    .style-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .color-palette {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .color-swatch:hover {
      transform: scale(1.15);
    }
    .color-swatch.active {
      transform: scale(1.15);
      box-shadow: 0 0 0 2px var(--primary);
    }

    .custom-color-wrap {
      position: relative;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      overflow: hidden;
    }
    .custom-color-wrap input[type="color"] {
      position: absolute;
      inset: -6px;
      width: 36px;
      height: 36px;
      opacity: 0;
      cursor: pointer;
    }

    .size-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: var(--radius-md);
    }

    .size-dot-box {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #size-preview-dot {
      border-radius: 50%;
      background: #1e293b;
      transition: width 0.1s, height 0.1s, background-color 0.1s;
    }

    #pen-size-slider {
      width: 78px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    #pen-size-label {
      font-size: 11px;
      font-family: monospace;
      color: var(--text-sub);
      min-width: 28px;
      text-align: right;
    }

    /* 紙質＆履歴アクション */
    .page-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .paper-select-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .paper-select-wrap svg {
      position: absolute;
      left: 9px;
      pointer-events: none;
      color: var(--text-sub);
    }
    #paper-type-select {
      padding: 6px 12px 6px 30px;
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }
    #paper-type-select:hover {
      background: var(--bg-hover);
    }

    .history-group {
      display: flex;
      align-items: center;
      background: var(--bg-muted);
      padding: 2px;
      border-radius: var(--radius-md);
    }
    .history-btn {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      color: var(--text-sub);
    }
    .history-btn:hover:not(:disabled) {
      background: #ffffff;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }
    .history-btn.danger:hover:not(:disabled) {
      background: var(--danger-soft);
      color: var(--danger);
    }

    /* キャンバスステージ */
    .canvas-stage {
      flex: 1;
      padding: 14px 16px 64px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .paper-sheet {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1024px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-strong);
      overflow: hidden;
    }

    .paper-sheet canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #bg-canvas {
      pointer-events: none;
      z-index: 1;
    }

    #drawing-canvas {
      z-index: 2;
      touch-action: none;
      cursor: crosshair;
    }

    /* キャンバス下部フローティング・ページナビゲーション */
    .floating-page-nav {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-md);
      z-index: 15;
    }

    .nav-pill-btn {
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
    }
    .nav-pill-btn:hover:not(:disabled) {
      background: var(--bg-muted);
      color: var(--text-main);
    }
    .nav-pill-btn.add-page {
      background: var(--accent-soft);
      color: var(--accent-hover);
    }
    .nav-pill-btn.add-page:hover {
      background: #fde68a;
    }

    .page-indicator {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      padding: 0 8px;
      white-space: nowrap;
    }

    /* ==========================================================================
       モーダル＆トースト通知
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(28, 25, 23, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 390px;
      padding: 20px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .modal-desc {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      font-size: 14px;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    .cover-color-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .cover-color-option {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 2px solid transparent;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }
    .cover-color-option.selected {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px var(--text-main);
      transform: scale(1.08);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }
    .btn-ghost {
      padding: 7px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--bg-muted);
    }
    .btn-ghost:hover {
      background: var(--bg-hover);
    }
    .btn-danger {
      padding: 7px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      background: var(--danger);
    }
    .btn-danger:hover {
      background: #b91c1c;
    }

    .toast {
      position: fixed;
      bottom: 66px;
      right: 18px;
      background: #292524;
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      padding: 9px 14px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 7px;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 90;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================================================
       レスポンシブ調整（モバイル・タブレット）
       ========================================================================== */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 54px;
        bottom: 0;
        left: 0;
        margin-left: 0 !important;
        transform: translateX(-100%);
        box-shadow: var(--shadow-lg);
      }
      .sidebar.mobile-open {
        transform: translateX(0);
      }
      .sidebar-overlay.mobile-open {
        display: block;
      }
      .tool-label {
        display: none;
      }
      .save-badge span {
        display: none;
      }
      .canvas-stage {
        padding: 8px 8px 60px 8px;
      }
      .nav-btn-text {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- トップヘッダー -->
  <header class="app-header">
    <div class="header-left">
      <button id="toggle-sidebar-btn" class="icon-btn" title="サイドバー開閉">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>

      <div class="breadcrumb-editor">
        <span id="header-notebook-dot" class="notebook-badge-dot" style="background-color: #b45309;"></span>
        <input type="text" id="header-notebook-input" class="header-title-input" value="アイデアノート" placeholder="ノート名..." title="ノート名を直接編集" />
        <span class="breadcrumb-sep">/</span>

  <script>
    (function () {
      'use strict';

      // =========================================================================
      // 定数・設定定義
      // =========================================================================
      const STORAGE_KEY = 'atelier_note_v2';

      const COVER_COLORS = [
        '#b45309', // アンバーブラウン
        '#1e3a8a', // ネイビー
        '#15803d', // フォレストグリーン
        '#be123c', // クリムゾン
        '#6d28d9', // ロイヤルパープル
        '#334155', // スレートグレー
        '#0f766e', // ティール
        '#c2410c'  // テラコッタ
      ];

      const PAPER_TYPES = {
        plain: { label: '無地', bg: '#ffffff' },
        ruled: { label: '横罫線', bg: '#fffdf9' },
        grid:  { label: '方眼', bg: '#ffffff' },
        dot:   { label: 'ドット方眼', bg: '#ffffff' },
        kraft: { label: 'クラフト紙', bg: '#d6b892' },
        dark:  { label: '黒板ダーク', bg: '#1e242b' }
      };

      // =========================================================================
      // DOM参照取得
      // =========================================================================
      const bgCanvas = document.getElementById('bg-canvas');
      const bgCtx = bgCanvas.getContext('2d');
      const drawingCanvas = document.getElementById('drawing-canvas');
      const ctx = drawingCanvas.getContext('2d');
      const paperSheet = document.getElementById('paper-sheet');

      const sidebar = document.getElementById('sidebar');
      const sidebarOverlay = document.getElementById('sidebar-overlay');
      const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');

      const headerNotebookDot = document.getElementById('header-notebook-dot');
      const headerNotebookInput = document.getElementById('header-notebook-input');
      const headerPageInput = document.getElementById('header-page-input');
      const saveStatus = document.getElementById('save-status');
      const saveStatusText = document.getElementById('save-status-text');
      const exportPngBtn = document.getElementById('export-png-btn');

      const notebooksListEl = document.getElementById('notebooks-list');
      const pagesListEl = document.getElementById('pages-list');
      const addNotebookBtn = document.getElementById('add-notebook-btn');
      const sidebarAddPageBtn = document.getElementById('sidebar-add-page-btn');

      const penSizeSlider = document.getElementById('pen-size-slider');
      const penSizeLabel = document.getElementById('pen-size-label');
      const sizePreviewDot = document.getElementById('size-preview-dot');
      const customColorPicker = document.getElementById('custom-color-picker');
      const paperTypeSelect = document.getElementById('paper-type-select');

      const undoBtn = document.getElementById('undo-btn');
      const redoBtn = document.getElementById('redo-btn');
      const clearPageBtn = document.getElementById('clear-page-btn');

      const prevPageBtn = document.getElementById('prev-page-btn');
      const nextPageBtn = document.getElementById('next-page-btn');
      const navAddPageBtn = document.getElementById('nav-add-page-btn');
      const pageIndicator = document.getElementById('page-indicator');

      // モーダル要素
      const editModal = document.getElementById('edit-modal');
      const editModalTitle = document.getElementById('edit-modal-title');
      const editModalLabel = document.getElementById('edit-modal-label');
      const editModalInput = document.getElementById('edit-modal-input');
      const editModalColorGroup = document.getElementById('edit-modal-color-group');
      const coverColorGrid = document.getElementById('cover-color-grid');
      const editModalCancel = document.getElementById('edit-modal-cancel');
      const editModalSave = document.getElementById('edit-modal-save');

      const confirmModal = document.getElementById('confirm-modal');
      const confirmModalTitle = document.getElementById('confirm-modal-title');
      const confirmModalDesc = document.getElementById('confirm-modal-desc');
      const confirmModalCancel = document.getElementById('confirm-modal-cancel');
      const confirmModalOk = document.getElementById('confirm-modal-ok');

      const toastEl = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');

      // =========================================================================
      // アプリケーション状態
      // =========================================================================
      let state = {
        activeNotebookId: null,
        notebooks: []
      };

      let toolState = {
        tool: 'ballpoint',
        color: '#1e293b',
        size: 3,
        isDrawing: false,
        lastX: 0,
        lastY: 0,
        lastTime: 0,
        lastWidth: 3
      };

      // Undo / Redo 用イメージスナップショット（dataURL配列）
      let undoHistory = [];
      let redoHistory = [];
      const MAX_HISTORY = 25;

      // 論理キャンバスサイズ
      let logicalWidth = 1000;
      let logicalHeight = 700;
      let dpr = window.devicePixelRatio || 1;

      // 鉛筆ノイズパターンキャッシュ
      const pencilPatternCache = {};

      // =========================================================================
      // ユーティリティ関数
      // =========================================================================
      function uid(prefix) {
        return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function (m) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
      }

      let toastTimer = null;
      function showToast(message) {
        toastMsg.textContent = message;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('show');
        }, 2200);
      }

      function getActiveNotebook() {
        return state.notebooks.find(function (nb) { return nb.id === state.activeNotebookId; }) || null;
      }

      function getActivePage() {
        const nb = getActiveNotebook();
        if (!nb) return null;
        return nb.pages.find(function (p) { return p.id === nb.activePageId; }) || nb.pages[0] || null;
      }

      // =========================================================================
      // 背景紙質描画エンジン（HTML5 Canvas 2D APIのみで完全に自己完結）
      // =========================================================================
      function drawPaperBackground(targetCtx, width, height, paperType) {
        const info = PAPER_TYPES[paperType] || PAPER_TYPES.plain;
        targetCtx.save();

        // ベース背景色
        targetCtx.fillStyle = info.bg;
        targetCtx.fillRect(0, 0, width, height);

        if (paperType === 'ruled') {
          // 横罫線（32px間隔）＋左マージン線
          const step = 32;
          targetCtx.strokeStyle = '#cbd5e1';
          targetCtx.lineWidth = 1;
          targetCtx.beginPath();
          for (let y = step * 2; y < height; y += step) {
            targetCtx.moveTo(0, y);
            targetCtx.lineTo(width, y);
          }
          targetCtx.stroke();

          targetCtx.strokeStyle = '#fca5a5';
          targetCtx.lineWidth = 1.5;
          targetCtx.beginPath();
          targetCtx.moveTo(60, 0);
          targetCtx.lineTo(60, height);
          targetCtx.stroke();

        } else if (paperType === 'grid') {
          // 方眼（24px間隔）
          const step = 24;
          targetCtx.strokeStyle = '#e2e8f0';
          targetCtx.lineWidth = 1;
          targetCtx.beginPath();
          for (let x = step; x < width; x += step) {
            targetCtx.moveTo(x, 0);
            targetCtx.lineTo(x, height);
          }
          for (let y = step; y < height; y += step) {
            targetCtx.moveTo(0, y);
            targetCtx.lineTo(width, y);
          }
          targetCtx.stroke();

        } else if (paperType === 'dot') {
          // ドット方眼（24px間隔）
          const step = 24;
          targetCtx.fillStyle = '#94a3b8';
          for (let x = step; x < width; x += step) {
            for (let y = step; y < height; y += step) {
              targetCtx.beginPath();
              targetCtx.arc(x, y, 1.25, 0, Math.PI * 2);
              targetCtx.fill();
            }
          }

        } else if (paperType === 'kraft') {
          // クラフト紙の繊維模様と周辺の柔らかな陰影
          targetCtx.fillStyle = 'rgba(110, 72, 34, 0.06)';
          for (let i = 0; i < 2400; i++) {
            const x = (i * 73) % width;
            const y = (i * 137) % height;
            const len = (i % 4) + 1;
            targetCtx.fillRect(x, y, len, 1);
          }
          const grad = targetCtx.createRadialGradient(
            width / 2, height / 2, width * 0.25,
            width / 2, height / 2, width * 0.78
          );
          grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
          grad.addColorStop(1, 'rgba(85, 52, 22, 0.14)');
          targetCtx.fillStyle = grad;
          targetCtx.fillRect(0, 0, width, height);

        } else if (paperType === 'dark') {
          // 黒板ダーク風の微細なガイド線
          targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
          targetCtx.lineWidth = 1;
          const step = 36;
          targetCtx.beginPath();
          for (let x = step; x < width; x += step) {
            targetCtx.moveTo(x, 0);
            targetCtx.lineTo(x, height);
          }
          for (let y = step; y < height; y += step) {
            targetCtx.moveTo(0, y);
            targetCtx.lineTo(width, y);
          }
          targetCtx.stroke();
        }

        targetCtx.restore();
      }

      // =========================================================================
      // キャンバスリサイズ＆imageData復元処理
      // =========================================================================
      function loadImageDataToCanvas(dataUrl, callback) {
        ctx.clearRect(0, 0, logicalWidth, logicalHeight);
        if (!dataUrl) {
          if (callback) callback();
          return;
        }
        const img = new Image();
        img.onload = function () {
          ctx.drawImage(img, 0, 0, logicalWidth, logicalHeight);
          if (callback) callback();
        };
        img.onerror = function () {
          if (callback) callback();
        };
        img.src = dataUrl;
      }

      function captureCanvasDataUrl() {
        return drawingCanvas.toDataURL('image/png');
      }

      function resizeCanvases() {
        const rect = paperSheet.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;

        // リサイズ前の描画内容を退避
        let snapshot = null;
        if (drawingCanvas.width > 0 && drawingCanvas.height > 0) {
          snapshot = captureCanvasDataUrl();
        }

        dpr = window.devicePixelRatio || 1;
        logicalWidth = rect.width;
        logicalHeight = rect.height;

        bgCanvas.width = Math.round(logicalWidth * dpr);
        bgCanvas.height = Math.round(logicalHeight * dpr);
        bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        drawingCanvas.width = Math.round(logicalWidth * dpr);
        drawingCanvas.height = Math.round(logicalHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const page = getActivePage();
        drawPaperBackground(bgCtx, logicalWidth, logicalHeight, page ? page.paperType : 'plain');

        const dataToRestore = snapshot || (page ? page.imageData : null);
        loadImageDataToCanvas(dataToRestore);
      }

      window.addEventListener('resize', resizeCanvases);

      // =========================================================================
      // 鉛筆粒子パターン＆ペン描画アルゴリズム
      // =========================================================================
      function getPencilPattern(color) {
        if (pencilPatternCache[color]) return pencilPatternCache[color];
        const c = document.createElement('canvas');
        c.width = 32;
        c.height = 32;
        const pCtx = c.getContext('2d');
        pCtx.fillStyle = color;
        for (let x = 0; x < 32; x++) {
          for (let y = 0; y < 32; y++) {
            if (((x * 17 + y * 31) % 10) > 2) {
              pCtx.globalAlpha = 0.4 + (((x + y) % 5) * 0.12);
              pCtx.fillRect(x, y, 1, 1);
            }
          }
        }
        const pattern = ctx.createPattern(c, 'repeat');
        pencilPatternCache[color] = pattern;
        return pattern;
      }

      function computeStrokeWidth(baseSize, tool, speed, pressure, hasPressure) {
        if (tool === 'fountain') {
          const speedFactor = Math.max(0.45, Math.min(1.4, 1.32 - speed * 0.48));
          const pressFactor = hasPressure ? (0.55 + pressure * 0.9) : 1.0;
          return Math.max(1, baseSize * speedFactor * pressFactor);
        }
        if (tool === 'brush') {
          const speedFactor = Math.max(0.28, Math.min(1.85, 1.7 - speed * 0.68));
          const pressFactor = hasPressure ? (0.35 + pressure * 1.35) : 1.0;
          return Math.max(1.5, baseSize * 1.45 * speedFactor * pressFactor);
        }
        if (tool === 'highlighter') {
          return Math.max(12, baseSize * 2.4);
        }
        if (tool === 'eraser') {
          return Math.max(6, baseSize * 2.0);
        }
        return baseSize;
      }

      function renderSegment(x0, y0, x1, y1, width) {
        ctx.save();
        const tool = toolState.tool;
        const color = toolState.color;

        if (tool === 'eraser') {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.strokeStyle = 'rgba(0,0,0,1)';
          ctx.fillStyle = 'rgba(0,0,0,1)';
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
        } else if (tool === 'highlighter') {
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 0.16;
          ctx.strokeStyle = color;
          ctx.fillStyle = color;
          ctx.lineCap = 'square';
          ctx.lineJoin = 'round';
        } else if (tool === 'pencil') {
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 0.72;
          const pat = getPencilPattern(color);
          ctx.strokeStyle = pat || color;
          ctx.fillStyle = pat || color;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
        } else {
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 1.0;
          ctx.strokeStyle = color;
          ctx.fillStyle = color;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
        }

        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
        ctx.restore();
      }

      function getPointerPos(e) {
        const rect = drawingCanvas.getBoundingClientRect();
        return {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top,
          pressure: (typeof e.pressure === 'number' && e.pressure > 0) ? e.pressure : 0.5,
          hasPressure: e.pointerType === 'pen' && typeof e.pressure === 'number' && e.pressure > 0
        };
      }

      drawingCanvas.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        drawingCanvas.setPointerCapture(e.pointerId);

        // 描画開始前にUndo用スナップショットを保存
        pushUndoSnapshot();

        const pos = getPointerPos(e);
        const now = performance.now();
        const initW = computeStrokeWidth(toolState.size, toolState.tool, 0.5, pos.pressure, pos.hasPressure);

        toolState.isDrawing = true;
        toolState.lastX = pos.x;
        toolState.lastY = pos.y;
        toolState.lastTime = now;
        toolState.lastWidth = initW;

        renderSegment(pos.x, pos.y, pos.x + 0.1, pos.y + 0.1, initW);
      });

      drawingCanvas.addEventListener('pointermove', function (e) {
        if (!toolState.isDrawing) return;
        const pos = getPointerPos(e);
        const now = performance.now();
        const dt = Math.max(1, now - toolState.lastTime);
        const dist = Math.hypot(pos.x - toolState.lastX, pos.y - toolState.lastY);

        if (dist < 0.8) return;

        const speed = dist / dt;
        const targetW = computeStrokeWidth(toolState.size, toolState.tool, speed, pos.pressure, pos.hasPressure);
        const smoothW = toolState.lastWidth * 0.65 + targetW * 0.35;

        renderSegment(toolState.lastX, toolState.lastY, pos.x, pos.y, smoothW);

        toolState.lastX = pos.x;
        toolState.lastY = pos.y;
        toolState.lastTime = now;
        toolState.lastWidth = smoothW;
      });

      function endPointerDrawing(e) {
        if (!toolState.isDrawing) return;
        toolState.isDrawing = false;

        if (e && typeof e.pointerId === 'number' && drawingCanvas.hasPointerCapture(e.pointerId)) {
          drawingCanvas.releasePointerCapture(e.pointerId);
        }

        // 現在のページに描画データを反映して自動保存
        const page = getActivePage();
        if (page) {
          page.imageData = captureCanvasDataUrl();
          scheduleAutoSave();
        }
      }

      drawingCanvas.addEventListener('pointerup', endPointerDrawing);
      drawingCanvas.addEventListener('pointercancel', endPointerDrawing);

      // =========================================================================
      // Undo / Redo / 全消去
      // =========================================================================
      function updateHistoryButtons() {
        undoBtn.disabled = undoHistory.length === 0;
        redoBtn.disabled = redoHistory.length === 0;
      }

      function pushUndoSnapshot() {
        undoHistory.push(captureCanvasDataUrl());
        if (undoHistory.length > MAX_HISTORY) {
          undoHistory.shift();
        }
        redoHistory = [];
        updateHistoryButtons();
      }

      function performUndo() {
        if (undoHistory.length === 0) return;
        const page = getActivePage();
        if (!page) return;

        redoHistory.push(captureCanvasDataUrl());
        const prevData = undoHistory.pop();
        updateHistoryButtons();

        loadImageDataToCanvas(prevData, function () {
          page.imageData = prevData;
          scheduleAutoSave();
        });
      }

      function performRedo() {
        if (redoHistory.length === 0) return;
        const page = getActivePage();
        if (!page) return;

        undoHistory.push(captureCanvasDataUrl());
        const nextData = redoHistory.pop();
        updateHistoryButtons();

        loadImageDataToCanvas(nextData, function () {
          page.imageData = nextData;
          scheduleAutoSave();
        });
      }

      undoBtn.addEventListener('click', performUndo);
      redoBtn.addEventListener('click', performRedo);

      clearPageBtn.addEventListener('click', function () {
        const page = getActivePage();
        if (!page) return;

        openConfirmModal(
          'ページの全消去',
          '現在開いているページの描画内容をすべて消去しますか？（「元に戻す」で復元できます）',
          function () {
            pushUndoSnapshot();
            ctx.clearRect(0, 0, logicalWidth, logicalHeight);
            page.imageData = captureCanvasDataUrl();
            scheduleAutoSave();
            showToast('ページを全消去しました');
          }
        );
      });

      window.addEventListener('keydown', function (e) {
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
          e.preventDefault();
          if (e.shiftKey) performRedo();
          else performUndo();
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
          e.preventDefault();
          performRedo();
        }
      });

      // =========================================================================
      // ツール・カラー・太さ・紙質UIイベント
      // =========================================================================
      document.querySelectorAll('.tool-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.tool-btn').forEach(function (b) {
            b.classList.remove('active');
          });
          btn.classList.add('active');
          toolState.tool = btn.getAttribute('data-tool');
          updateSizePreview();
        });
      });

      function setActiveColor(hex) {
        toolState.color = hex;
        customColorPicker.value = hex;

        document.querySelectorAll('.color-swatch').forEach(function (sw) {
          if (sw.getAttribute('data-color').toLowerCase() === hex.toLowerCase()) {
            sw.classList.add('active');
          } else {
            sw.classList.remove('active');
          }
        });

        // 消しゴム選択中に色を選んだ場合はボールペンへ自動切替
        if (toolState.tool === 'eraser') {
          const bpBtn = document.querySelector('.tool-btn[data-tool="ballpoint"]');
          if (bpBtn) bpBtn.click();
        }
        updateSizePreview();
      }

      document.querySelectorAll('.color-swatch').forEach(function (sw) {
        sw.addEventListener('click', function () {
          setActiveColor(sw.getAttribute('data-color'));
        });
      });

      customColorPicker.addEventListener('input', function (e) {
        setActiveColor(e.target.value);
      });

      function updateSizePreview() {
        const size = parseInt(penSizeSlider.value, 10) || 3;
        toolState.size = size;
        penSizeLabel.textContent = size + 'px';

        const dotPx = Math.min(20, Math.max(3, size));
        sizePreviewDot.style.width = dotPx + 'px';
        sizePreviewDot.style.height = dotPx + 'px';
        sizePreviewDot.style.backgroundColor = toolState.tool === 'eraser' ? '#9ca3af' : toolState.color;
      }

      penSizeSlider.addEventListener('input', updateSizePreview);
      updateSizePreview();

      paperTypeSelect.addEventListener('change', function (e) {
        const page = getActivePage();
        if (!page) return;
        const newPaper = e.target.value;
        page.paperType = newPaper;

        drawPaperBackground(bgCtx, logicalWidth, logicalHeight, newPaper);

        // 黒板ダーク選択時にペン色が黒系なら自動で白へ切り替え
        const c = toolState.color.toLowerCase();
        if (newPaper === 'dark' && (c === '#1e293b' || c === '#000000' || c === '#1e3a8a')) {
          setActiveColor('#ffffff');
          showToast('黒板ダークに合わせてペン色を白に切り替えました');
        } else if (newPaper !== 'dark' && newPaper !== 'kraft' && c === '#ffffff') {
          setActiveColor('#1e293b');
        }

        renderSidebar();
        scheduleAutoSave();
      });

      // =========================================================================
      // ノート＆ページ管理ロジック（2階層構造）
      // =========================================================================
      function createPageObject(title, paperType) {
        return {
          id: uid('page'),
          title: title || '無題のページ',
          paperType: paperType || 'ruled',
          imageData: null
        };
      }

      function createNotebookObject(title, color) {
        const firstPage = createPageObject('1ページ目', 'ruled');
        return {
          id: uid('nb'),
          title: title || '無題のノート',
          color: color || COVER_COLORS[0],
          activePageId: firstPage.id,
          pages: [firstPage]
        };
      }

      // 現在のキャンバスの描画内容を現在のページオブジェクトに確定保存
      function flushCurrentCanvasToPage() {
        const page = getActivePage();
        if (page && drawingCanvas.width > 0 && drawingCanvas.height > 0) {
          page.imageData = captureCanvasDataUrl();
        }
      }

      function selectNotebook(notebookId) {
        if (state.activeNotebookId === notebookId) return;
        flushCurrentCanvasToPage();

        const targetNb = state.notebooks.find(function (nb) { return nb.id === notebookId; });
        if (!targetNb) return;

        state.activeNotebookId = targetNb.id;
        if (!targetNb.pages || targetNb.pages.length === 0) {
          const p = createPageObject('1ページ目', 'ruled');
          targetNb.pages = [p];
          targetNb.activePageId = p.id;
        }
        if (!targetNb.pages.some(function (p) { return p.id === targetNb.activePageId; })) {
          targetNb.activePageId = targetNb.pages[0].id;
        }

        loadCurrentPageIntoEditor();
        scheduleAutoSave();
      }

      function selectPage(pageId) {
        const nb = getActiveNotebook();
        if (!nb || nb.activePageId === pageId) return;

        const targetPage = nb.pages.find(function (p) { return p.id === pageId; });
        if (!targetPage) return;

        flushCurrentCanvasToPage();
        nb.activePageId = targetPage.id;

        loadCurrentPageIntoEditor();
        scheduleAutoSave();

        if (window.innerWidth <= 768) {
          closeMobileSidebar();
        }
      }

      function loadCurrentPageIntoEditor() {
        const nb = getActiveNotebook();
        const page = getActivePage();
        if (!nb || !page) return;

        undoHistory = [];
        redoHistory = [];
        updateHistoryButtons();

        // ヘッダー＆ツールバー同期
        headerNotebookDot.style.backgroundColor = nb.color || COVER_COLORS[0];
        headerNotebookInput.value = nb.title;
        headerPageInput.value = page.title;
        paperTypeSelect.value = page.paperType || 'plain';

        // キャンバス描画更新
        drawPaperBackground(bgCtx, logicalWidth, logicalHeight, page.paperType || 'plain');
        loadImageDataToCanvas(page.imageData);

        renderSidebar();
        updatePageNavigation();
      }

      function addNewNotebook() {
        flushCurrentCanvasToPage();
        const num = state.notebooks.length + 1;
        const color = COVER_COLORS[(num - 1) % COVER_COLORS.length];
        const newNb = createNotebookObject('ノート #' + num, color);
        state.notebooks.unshift(newNb);
        state.activeNotebookId = newNb.id;

        loadCurrentPageIntoEditor();
        scheduleAutoSave();
        showToast('新しいノートを追加しました');
      }

      function addNewPageToCurrentNotebook() {
        const nb = getActiveNotebook();
        if (!nb) return;
        flushCurrentCanvasToPage();

        const currentPage = getActivePage();
        const inheritedPaper = currentPage ? currentPage.paperType : 'ruled';
        const nextNum = nb.pages.length + 1;
        const newPage = createPageObject(nextNum + 'ページ目', inheritedPaper);

        nb.pages.push(newPage);
        nb.activePageId = newPage.id;

        loadCurrentPageIntoEditor();
        scheduleAutoSave();
        showToast(newPage.title + ' を追加しました');
      }

      function deleteNotebook(notebookId) {
        if (state.notebooks.length <= 1) {
          showToast('最後の1冊は削除できません');
          return;
        }
        const target = state.notebooks.find(function (nb) { return nb.id === notebookId; });
        if (!target) return;

        openConfirmModal(
          'ノートの削除',
          'ノート「' + target.title + '」（全' + target.pages.length + 'ページ）を削除しますか？この操作は取り消せません。',
          function () {
            state.notebooks = state.notebooks.filter(function (nb) { return nb.id !== notebookId; });
            if (state.activeNotebookId === notebookId) {
              state.activeNotebookId = state.notebooks[0].id;
              loadCurrentPageIntoEditor();
            } else {
              renderSidebar();
            }
            scheduleAutoSave();
            showToast('ノートを削除しました');
          }
        );
      }

      function deletePage(pageId) {
        const nb = getActiveNotebook();
        if (!nb) return;
        if (nb.pages.length <= 1) {
          showToast('最後の1ページは削除できません');
          return;
        }
        const idx = nb.pages.findIndex(function (p) { return p.id === pageId; });
        if (idx === -1) return;
        const target = nb.pages[idx];

        openConfirmModal(
          'ページの削除',
          'ページ「' + target.title + '」を削除しますか？この操作は取り消せません。',
          function () {
            nb.pages.splice(idx, 1);
            if (nb.activePageId === pageId) {
              const nextIdx = Math.min(idx, nb.pages.length - 1);
              nb.activePageId = nb.pages[nextIdx].id;
              loadCurrentPageIntoEditor();
            } else {
              renderSidebar();
              updatePageNavigation();
            }
            scheduleAutoSave();
            showToast('ページを削除しました');
          }
        );
      }

      // =========================================================================
      // 編集モーダル（ノート名＋表紙カラー / ページ名）
      // =========================================================================
      function openNotebookEditModal(notebookId) {
        const nb = state.notebooks.find(function (n) { return n.id === notebookId; });
        if (!nb) return;

        let selectedColor = nb.color || COVER_COLORS[0];
        editModalTitle.textContent = 'ノートの編集';
        editModalLabel.textContent = 'ノート名';
        editModalInput.value = nb.title;
        editModalColorGroup.style.display = 'block';

        coverColorGrid.innerHTML = '';
        COVER_COLORS.forEach(function (hex) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cover-color-option' + (hex.toLowerCase() === selectedColor.toLowerCase() ? ' selected' : '');
          btn.style.backgroundColor = hex;
          btn.addEventListener('click', function () {
            selectedColor = hex;
            coverColorGrid.querySelectorAll('.cover-color-option').forEach(function (b) {
              b.classList.remove('selected');
            });
            btn.classList.add('selected');
          });
          coverColorGrid.appendChild(btn);
        });

        editModal.classList.add('open');
        editModalInput.focus();
        editModalInput.select();

        function close() {
          editModal.classList.remove('open');
          editModalSave.onclick = null;
          editModalCancel.onclick = null;
        }

        editModalCancel.onclick = close;
        editModalSave.onclick = function () {
          const val = editModalInput.value.trim();
          nb.title = val || '無題のノート';
          nb.color = selectedColor;
          if (nb.id === state.activeNotebookId) {
            headerNotebookInput.value = nb.title;
            headerNotebookDot.style.backgroundColor = nb.color;
          }
          renderSidebar();
          scheduleAutoSave();
          showToast('ノート情報を更新しました');
          close();
        };
      }

      function openPageEditModal(pageId) {
        const nb = getActiveNotebook();
        if (!nb) return;
        const page = nb.pages.find(function (p) { return p.id === pageId; });
        if (!page) return;

        editModalTitle.textContent = 'ページ名の編集';
        editModalLabel.textContent = 'ページ名';
        editModalInput.value = page.title;
        editModalColorGroup.style.display = 'none';

        editModal.classList.add('open');
        editModalInput.focus();
        editModalInput.select();

        function close() {
          editModal.classList.remove('open');
          editModalSave.onclick = null;
          editModalCancel.onclick = null;
        }

        editModalCancel.onclick = close;
        editModalSave.onclick = function () {
          const val = editModalInput.value.trim();
          page.title = val || '無題のページ';
          if (page.id === nb.activePageId) {
            headerPageInput.value = page.title;
          }
          renderSidebar();
          scheduleAutoSave();
          showToast('ページ名を更新しました');
          close();
        };
      }

      editModalInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && editModalSave.onclick) {
          e.preventDefault();
          editModalSave.onclick();
        } else if (e.key === 'Escape' && editModalCancel.onclick) {
          editModalCancel.onclick();
        }
      });

      function openConfirmModal(title, desc, onConfirm) {
        confirmModalTitle.textContent = title;
        confirmModalDesc.textContent = desc;
        confirmModal.classList.add('open');

        function close() {
          confirmModal.classList.remove('open');
          confirmModalOk.onclick = null;
          confirmModalCancel.onclick = null;
        }

        confirmModalCancel.onclick = close;
        confirmModalOk.onclick = function () {
          close();
          onConfirm();
        };
      }

      // =========================================================================
      // サイドバー＆ナビゲーション描画
      // =========================================================================
      function renderSidebar() {
        // 1. ノートブック一覧
        notebooksListEl.innerHTML = '';
        state.notebooks.forEach(function (nb) {
          const isActive = nb.id === state.activeNotebookId;
          const card = document.createElement('div');
          card.className = 'item-card' + (isActive ? ' active' : '');

          card.innerHTML =
            '<div class="item-card-main">' +
              '<span class="notebook-cover-icon" style="background-color:' + escapeHtml(nb.color || '#b45309') + ';"></span>' +
              '<div class="item-info">' +
                '<div class="item-title">' + escapeHtml(nb.title) + '</div>' +
                '<div class="item-meta"><span>' + nb.pages.length + ' ページ</span></div>' +
              '</div>' +
            '</div>' +
            '<div class="item-actions">' +
              '<button type="button" class="mini-action-btn edit" title="ノート名・表紙を編集">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>' +
              '</button>' +
              '<button type="button" class="mini-action-btn delete" title="ノートを削除">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>' +
              '</button>' +
            '</div>';

          card.addEventListener('click', function () {
            selectNotebook(nb.id);
          });
          card.addEventListener('dblclick', function (e) {
            e.stopPropagation();
            openNotebookEditModal(nb.id);
          });

          const editBtn = card.querySelector('.edit');
          editBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            openNotebookEditModal(nb.id);
          });

          const delBtn = card.querySelector('.delete');
          delBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            deleteNotebook(nb.id);
          });

          notebooksListEl.appendChild(card);
        });

        // 2. 選択中ノートのページ一覧
        pagesListEl.innerHTML = '';
        const activeNb = getActiveNotebook();
        if (!activeNb) return;

        activeNb.pages.forEach(function (page, index) {
          const isActive = page.id === activeNb.activePageId;
          const paperInfo = PAPER_TYPES[page.paperType] || PAPER_TYPES.plain;

          const card = document.createElement('div');
          card.className = 'item-card' + (isActive ? ' active' : '');

          card.innerHTML =
            '<div class="item-card-main">' +
              '<span class="page-num-badge">' + (index + 1) + '</span>' +
              '<div class="item-info">' +
                '<div class="item-title">' + escapeHtml(page.title) + '</div>' +
                '<div class="item-meta"><span>' + escapeHtml(paperInfo.label) + '</span></div>' +
              '</div>' +
            '</div>' +
            '<div class="item-actions">' +
              '<button type="button" class="mini-action-btn edit" title="ページ名を編集">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>' +
              '</button>' +
              '<button type="button" class="mini-action-btn delete" title="ページを削除">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>' +
              '</button>' +
            '</div>';

          card.addEventListener('click', function () {
            selectPage(page.id);
          });
          card.addEventListener('dblclick', function (e) {
            e.stopPropagation();
            openPageEditModal(page.id);
          });

          const editBtn = card.querySelector('.edit');
          editBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            openPageEditModal(page.id);
          });

          const delBtn = card.querySelector('.delete');
          delBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            deletePage(page.id);
          });

          pagesListEl.appendChild(card);
        });
      }

      function updatePageNavigation() {
        const nb = getActiveNotebook();
        if (!nb) return;
        const idx = nb.pages.findIndex(function (p) { return p.id === nb.activePageId; });
        const total = nb.pages.length;
        const currentNum = idx >= 0 ? idx + 1 : 1;

        pageIndicator.textContent = currentNum + ' / ' + total + ' ページ';
        prevPageBtn.disabled = currentNum <= 1;
        nextPageBtn.disabled = currentNum >= total;
      }

      // ヘッダー入力欄からの直接編集
      headerNotebookInput.addEventListener('input', function (e) {
        const nb = getActiveNotebook();
        if (!nb) return;
        nb.title = e.target.value || '無題のノート';
        renderSidebar();
        scheduleAutoSave();
      });

      headerPageInput.addEventListener('input', function (e) {
        const page = getActivePage();
        if (!page) return;
        page.title = e.target.value || '無題のページ';
        renderSidebar();
        scheduleAutoSave();
      });

      // ボタンイベント紐付け
      addNotebookBtn.addEventListener('click', addNewNotebook);
      sidebarAddPageBtn.addEventListener('click', addNewPageToCurrentNotebook);
      navAddPageBtn.addEventListener('click', addNewPageToCurrentNotebook);

      prevPageBtn.addEventListener('click', function () {
        const nb = getActiveNotebook();
        if (!nb) return;
        const idx = nb.pages.findIndex(function (p) { return p.id === nb.activePageId; });
        if (idx > 0) selectPage(nb.pages[idx - 1].id);
      });

      nextPageBtn.addEventListener('click', function () {
        const nb = getActiveNotebook();
        if (!nb) return;
        const idx = nb.pages.findIndex(function (p) { return p.id === nb.activePageId; });
        if (idx >= 0 && idx < nb.pages.length - 1) selectPage(nb.pages[idx + 1].id);
      });

      // サイドバー開閉（PC折りたたみ / モバイルドロワー）
      function closeMobileSidebar() {
        sidebar.classList.remove('mobile-open');
        sidebarOverlay.classList.remove('mobile-open');
      }

      toggleSidebarBtn.addEventListener('click', function () {
        if (window.innerWidth <= 768) {
          sidebar.classList.toggle('mobile-open');
          sidebarOverlay.classList.toggle('mobile-open');
        } else {
          sidebar.classList.toggle('collapsed');
          setTimeout(resizeCanvases, 260);
        }
      });

      sidebarOverlay.addEventListener('click', closeMobileSidebar);

      // =========================================================================
      // LocalStorage 自動保存＆PNG合成出力
      // =========================================================================
      let saveTimer = null;
      function scheduleAutoSave() {
        saveStatus.className = 'save-badge saving';
        saveStatusText.textContent = '保存中...';

        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            saveStatus.className = 'save-badge saved';
            saveStatusText.textContent = '保存済み';
          } catch (err) {
            saveStatus.className = 'save-badge';
            saveStatusText.textContent = '保存エラー';
            showToast('保存容量の上限に達した可能性があります');
          }
        }, 350);
      }

      exportPngBtn.addEventListener('click', function () {
        const nb = getActiveNotebook();
        const page = getActivePage();
        if (!nb || !page) return;

        const outCanvas = document.createElement('canvas');
        outCanvas.width = Math.round(logicalWidth * dpr);
        outCanvas.height = Math.round(logicalHeight * dpr);
        const outCtx = outCanvas.getContext('2d');
        outCtx.scale(dpr, dpr);

        // 1. 背景紙質を描画
        drawPaperBackground(outCtx, logicalWidth, logicalHeight, page.paperType || 'plain');
        // 2. 手書きレイヤーを合成
        outCtx.drawImage(drawingCanvas, 0, 0, logicalWidth, logicalHeight);

        const safeName = (nb.title + '_' + page.title).replace(/[\\/:*?"<>|]/g, '_');
        const link = document.createElement('a');
        link.download = safeName + '.png';
        link.href = outCanvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        showToast('PNG画像をダウンロードしました');
      });

      // =========================================================================
      // 初期化処理
      // =========================================================================
      function initApp() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.notebooks) && parsed.notebooks.length > 0) {
              state = parsed;
            }
          }
        } catch (e) {
          // 破損データ時は新規初期化へフォールバック
        }

        if (state.notebooks.length === 0) {
          const initialNb = createNotebookObject('アイデアノート', COVER_COLORS[0]);
          state.notebooks.push(initialNb);
          state.activeNotebookId = initialNb.id;
        }

        if (!state.notebooks.some(function (nb) { return nb.id === state.activeNotebookId; })) {
          state.activeNotebookId = state.notebooks[0].id;
        }

        requestAnimationFrame(function () {
          resizeCanvases();
          loadCurrentPageIntoEditor();
        });
      }

      window.addEventListener('DOMContentLoaded', initApp);
    })();
  </script>
</body>
</html>
