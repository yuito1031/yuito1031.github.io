<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neo study park group</title>
  <style>
    /* 配色定義：生成り色・アースカラー */
    :root {
      --bg-color: #f7f4ef;        /* 温かみのある生成り色 */
      --card-bg: #fffefb;         /* 柔らかなアイボリーホワイト */
      --text-color: #383531;      /* 落ち着いたダークブラウン */
      --text-sub: #78736a;       /* サブテキストカラー */
      --accent-color: #8c6d53;    /* アースブラウン */
      --accent-hover: #6e543e;    /* アースブラウン（濃いめ） */
      --accent-light: #e8dfd5;    /* ハイライト */
      --shadow-sm: 0 4px 15px rgba(140, 109, 83, 0.06);
      --shadow-hover: 0 12px 28px rgba(140, 109, 83, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.7;
      overflow-x: hidden;
    }

    /* Keyframe アニメーション */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ナビゲーションバー */
    nav {
      background: rgba(255, 254, 251, 0.9);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--accent-light);
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--accent-color);
      letter-spacing: 0.03em;
    }

    .nav-buttons {
      display: flex;
      gap: 0.8rem;
    }

    .btn {
      padding: 0.4rem 1.1rem;
      border-radius: 20px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 1px solid var(--accent-color);
      font-weight: 600;
    }

    .btn-outline {
      background: transparent;
      color: var(--accent-color);
    }

    .btn-outline:hover {
      background: var(--accent-light);
    }

    .btn-filled {
      background: var(--accent-color);
      color: #fff;
    }

    .btn-filled:hover {
      background: var(--accent-hover);
    }

    /* ヘッダー */
    header {
      background: linear-gradient(135deg, #f2eae1 0%, #e8dfd5 100%);
      padding: 3.5rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--accent-light);
      animation: fadeInUp 0.8s ease-out forwards;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--text-color);
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* メインコンテンツ */
    .container {
      max-width: 800px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }

    .card-grid {
      display: grid;
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.8rem;
      border: 1px solid rgba(220, 210, 200, 0.5);
      box-shadow: var(--shadow-sm);
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      opacity: 0;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .card:nth-child(1) { animation-delay: 0.2s; }
    .card:nth-child(2) { animation-delay: 0.4s; }
